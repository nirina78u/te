<section>

<section>

        <div class="child-head-mobile"><strong onclick="toggle_login()"><img src="./icone/admin_alt.png" class="icone-menue" width="18px" onclick="toggle_menue()" alt="">Login</strong></div>
    </div>
    </div>
</section>

    <br><br>
    <input type="text" class="input-login" placeholder="Password">
    <br><br>
    <button type="button" class="btn-login"><strong>Login</strong></button>
</form>
</div>
</section>

<div class="break-mobile">

    </div>
